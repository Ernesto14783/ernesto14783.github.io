// ── DB HELPERS ────────────────────────────────────────────────────────────
function lsGet(key,def=null){ try{const v=localStorage.getItem("cs_"+key);return v?JSON.parse(v):def;}catch{return def;} }
function lsSet(key,val){ try{localStorage.setItem("cs_"+key,JSON.stringify(val));}catch{} }

async function dbGet(key){
  if(!CONFIGURED) return null;
  try{
    const {data,error}=await sb.from("ernesto_data").select("data").eq("id",key).maybeSingle();
    if(error||!data) return null;
    return data.data;
  }catch{return null;}
}
async function dbSet(key,val){
  lsSet(key,val);
  if(!CONFIGURED) return;
  try{ await sb.from("ernesto_data").upsert({id:key,data:val,updated_at:new Date().toISOString()},{onConflict:"id"}); }catch{}
}

function useDB(key,initial){
  const [val,setValRaw]=useState(()=>lsGet(key,initial));
  const [ready,setReady]=useState(false);
  useEffect(()=>{
    dbGet(key).then(remote=>{
      if(remote!==null){setValRaw(remote);lsSet(key,remote);}
      setReady(true);
    });
  },[key]);
  const set=useCallback(v=>{
    setValRaw(prev=>{
      const next=typeof v==="function"?v(prev):v;
      dbSet(key,next);
      return next;
    });
  },[key]);
  return [val,set,ready];
}

// ── MAAN DATA ─────────────────────────────────────────────────────────────
function getMoonData(){
  const now=new Date(),y=now.getFullYear(),m=now.getMonth()+1,d=now.getDate();
  const JD=367*y-Math.floor(7*(y+Math.floor((m+9)/12))/4)+Math.floor(275*m/9)+d+1721013.5;
  const phase=((JD-2451549.5)%29.53058867+29.53058867)%29.53058867;
  let phaseNL;
  if(phase<1.85)phaseNL="Nieuwe Maan";
  else if(phase<7.38)phaseNL="Wassende Sikkel";
  else if(phase<9.22)phaseNL="Eerste Kwartier";
  else if(phase<14.77)phaseNL="Wassende Maan";
  else if(phase<16.61)phaseNL="Volle Maan";
  else if(phase<22.15)phaseNL="Afnemende Maan";
  else if(phase<23.99)phaseNL="Laatste Kwartier";
  else phaseNL="Afnemende Sikkel";
  const moonSign=["Ram","Stier","Tweelingen","Kreeft","Leeuw","Maagd","Weegschaal","Schorpioen","Boogschutter","Steenbok","Waterman","Vissen"][Math.floor(((phase/29.53058867)*360+218.316)%360/30)];
  const digits=`${d}${m}${y}`.split("").map(Number);
  let sum=digits.reduce((a,b)=>a+b,0);
  while(sum>9&&sum!==11&&sum!==22&&sum!==33)sum=String(sum).split("").map(Number).reduce((a,b)=>a+b,0);
  return{phaseNL,moonSign,dagGetal:sum};
}

function getCurrentMoonPhase(){
  const today=new Date();today.setHours(0,0,0,0);
  const sorted=MOON_PHASES.slice().sort((a,b)=>a.date-b.date);
  let current=sorted[0],next=sorted[1];
  for(let i=0;i<sorted.length;i++){
    if(sorted[i].date<=today){current=sorted[i];next=sorted[i+1]||null;}
  }
  return{current,next};
}

// ── HOME ──────────────────────────────────────────────────────────────────
function HomeSection({onNavigate}){
  const todayKey=getTodayKey();
  const [weer,setWeer]=useState(null);
  const [taken,setTaken,takenReady]=useDB("taken",[]);
  const [routines,setRoutines]=useDB("routines",[])[0];
  const setRoutinesDB=useDB("routines",[])[1];
  const [nieuweTask,setNieuweTask]=useState("");
  const [taskType,setTaskType]=useState("dag");

    const stored=lsGet(`energie_${todayKey}`);
    if(stored?.["Persoonlijk Weerbericht"])setWeer(stored["Persoonlijk Weerbericht"]);
  },[]);

  const addTask=()=>{
    const t=nieuweTask.trim();if(!t)return;
    setTaken(prev=>[...prev,{id:Date.now().toString(),tekst:t,type:taskType,done:false}]);
    setNieuweTask("");
  };
  const toggleTask=id=>setTaken(prev=>prev.map(t=>t.id===id?{...t,done:!t.done}:t));
  const deleteTask=id=>setTaken(prev=>prev.filter(t=>t.id!==id));

  const toggleRoutine=id=>{
    setRoutinesDB(prev=>prev.map(r=>{
      if(r.id!==id)return r;
      const done={...(r.done||{})};
      done[todayKey]=!done[todayKey];
      return{...r,done};
    }));
  };

  const maanTaken=taken.filter(t=>t.type==="maan");
  const dagTaken=taken.filter(t=>t.type==="dag");
  const activeRoutines=routines.filter(r=>r.actief!==false);

  return(
    <div>
      {/* Weerbericht */}
      {weer?(
        <div style={{...S.card,borderLeft:"3px solid var(--accent)",marginBottom:24}}>
          <div style={S.label}>Persoonlijk Weerbericht</div>
          <p style={{fontSize:14,lineHeight:1.85,color:"var(--text2)",fontStyle:"italic"}}>{weer}</p>

        </div>
      ):(
        <div style={{marginBottom:24}}>
          <button onClick={()=>onNavigate("energie")} style={{...S.btnGhost,width:"100%",padding:"14px",fontStyle:"italic",color:"var(--text3)",fontSize:13}}>Dagenergie laden →</button>
        </div>

      {/* Taken */}
      <div style={{marginBottom:26}}>
        <div style={S.label}>Taken</div>
        <div style={{display:"flex",gap:8,marginBottom:14}}>
          <select value={taskType} onChange={e=>setTaskType(e.target.value)} style={{background:"var(--bg)",border:"1px solid var(--border2)",borderRadius:10,color:"var(--text2)",padding:"10px 9px",fontSize:12,fontFamily:"'Quicksand',sans-serif",outline:"none",cursor:"pointer",flexShrink:0}}>
            <option value="dag">dag</option>
            <option value="maan">maan</option>
          </select>
          <input value={nieuweTask} onChange={e=>setNieuweTask(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addTask()} placeholder="Taak toevoegen..." style={{...S.input,minWidth:0}} />
          <button onClick={addTask} style={{background:"var(--accent2)",border:"1px solid rgba(201,169,110,0.3)",color:"var(--accent)",borderRadius:10,width:38,height:38,fontSize:22,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>+</button>
        </div>
        {maanTaken.length>0&&<div style={{...S.label,marginBottom:7}}>Maanwerk</div>}
        {maanTaken.map(t=><TaskItem key={t.id} task={t} onToggle={toggleTask} onDelete={deleteTask} accent="#c9a96e"/>)}
        {dagTaken.length>0&&<div style={{...S.label,marginBottom:7,marginTop:maanTaken.length>0?12:0}}>Dag</div>}
        {dagTaken.map(t=><TaskItem key={t.id} task={t} onToggle={toggleTask} onDelete={deleteTask} accent="var(--text2)"/>)}

function TaskItem({task,onToggle,onDelete,accent}){
  return(
    <div style={{display:"flex",alignItems:"flex-start",gap:10,padding:"9px 0",borderBottom:"1px solid var(--border)",opacity:task.done?0.45:1}}>
      <button onClick={()=>onToggle(task.id)} style={{width:18,height:18,borderRadius:"50%",border:`1.5px solid ${task.done?accent:"var(--border2)"}`,background:task.done?"var(--accent2)":"transparent",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,color:accent,flexShrink:0,marginTop:2}}>
        {task.done?"✓":""}
      </button>
      <div style={{width:5,height:5,borderRadius:"50%",background:accent,flexShrink:0,marginTop:7}}/>
      <span style={{flex:1,fontSize:14,color:"var(--text)",lineHeight:1.5,textDecoration:task.done?"line-through":"none",fontWeight:400}}>{task.tekst}</span>
      <button onClick={()=>onDelete(task.id)} style={{background:"none",border:"none",color:"var(--text3)",cursor:"pointer",fontSize:17,padding:0,lineHeight:1}}>×</button>
    </div>
  );
}

function getLast7(done){
  const today=new Date();today.setHours(0,0,0,0);
  return Array.from({length:7},(_,i)=>{const d=new Date(today);d.setDate(d.getDate()-(6-i));return!!done[d.toISOString().split("T")[0]];});
}
function calcStreak(done){
  const today=new Date();today.setHours(0,0,0,0);
  let s=0,d=new Date(today);
  while(s<366){if(done[d.toISOString().split("T")[0]]){s++;d.setDate(d.getDate()-1);}else break;}
  return s;
}

            <button onClick={save} style={S.btnPrimary}>Opslaan</button>
          </div>
        ):(
          <div style={{display:"flex",flexDirection:"column",gap:14}}>
            <div>
              <div style={S.label}>{isNieuw?"Intentie":"Loslaten"}</div>
              <p style={{fontSize:14,color:intentie?"var(--text2)":"var(--text3)",fontStyle:"italic",lineHeight:1.75}}>{intentie||"Nog niets ingevuld."}</p>
            </div>
            {!isNieuw&&reflectie&&<div><div style={S.label}>Reflectie</div><p style={{fontSize:14,color:"var(--text2)",fontStyle:"italic",lineHeight:1.75}}>{reflectie}</p></div>}
            <button onClick={startEdit} style={S.btnGhost}>{intentie?"Bewerken":"Invullen"}</button>
          </div>
        )}
      </div>
      {next&&(
        <div style={{...S.card,opacity:0.7}}>
          <div style={{display:"flex",alignItems:"flex-start",gap:14}}>
            <span style={{fontSize:24,lineHeight:1}}>{next.type==="nieuw"?"🌑":"🌕"}</span>
            <div style={{flex:1}}>
              <div style={{fontSize:15,fontWeight:500,color:"var(--text2)",marginBottom:3}}>{next.type==="nieuw"?"Nieuwe Maan":"Volle Maan"} in {next.sign}</div>
              <div style={{fontSize:12,color:"var(--text3)"}}>{fmtShort(next.date)}</div>
              <div style={{fontSize:12,color:"var(--text3)",marginTop:6,fontStyle:"italic"}}>{next.type==="nieuw"?"De volgende cyclus begint. Begin je intentie voor te bereiden.":"De volgende volle maan nadert. Voel al wat je wilt loslaten."}</div>
            </div>
            <div style={{fontSize:11,padding:"3px 10px",borderRadius:20,background:"var(--bg2)",color:"var(--text3)",whiteSpace:"nowrap",flexShrink:0}}>over {daysUntil(next.date)} {daysUntil(next.date)===1?"dag":"dagen"}</div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── ENERGIE ───────────────────────────────────────────────────────────────
function EnergieSection(){
  const todayKey=getTodayKey();
  const cacheKey=`energie_${todayKey}`;
  const[reading,setReadingRaw]=useState(()=>lsGet(cacheKey));
  const[loading,setLoading]=useState(false);
  const[error,setError]=useState(null);

  const parseReading=text=>{
    const sections=["Horoscoop","Human Design","Numerologie","The Pattern","Persoonlijk Weerbericht"];
    const result={generatedOn:todayKey};
    sections.forEach((s,i)=>{
      const next=sections[i+1];
      const regex=next?new RegExp(`\\*\\*${s}\\*\\*([\\s\\S]*?)\\*\\*${next}\\*\\*`):new RegExp(`\\*\\*${s}\\*\\*([\\s\\S]*?)$`);
      const match=text.match(regex);
      result[s]=match?match[1].trim():"";
    });
    return result;
  };

  const saveReading=async parsed=>{
    lsSet(cacheKey,parsed);
    await dbSet(cacheKey,parsed);
    setReadingRaw(parsed);
  };

  const generateReading=async()=>{
    setLoading(true);setError(null);
    const moon=getMoonData();
    const prompt=`Je bent een persoonlijke energiegids voor ${ERNESTO.naam}, geboren op ${ERNESTO.geboortedatum} om ${ERNESTO.geboortetijd} in ${ERNESTO.geboorteplaats}.

Zijn profiel:
- Sterrenbeeld: ${ERNESTO.sterrenbeeld} (Zon), met Steenbok Ascendant
- Human Design: ${ERNESTO.humanDesignType}, Profiel ${ERNESTO.humanDesignProfile}
- Levensgetal: ${ERNESTO.lifePath}
- Doel: succesvol ondernemen, zelfstandig leven in een camper, 3000 netto per maand
- Beroep: bewustzijnscoach en ceremonieleider

Vandaag is het ${getTodayFull()}. Maanfase: ${moon.phaseNL} in ${moon.moonSign}. Dagenergie: ${moon.dagGetal}.

Genereer een persoonlijk dagelijks energierapport in het Nederlands. Warm, direct, concreet. Geen bullets. Geen uitroeptekens. Geen AI-taal. Spreek Ernesto aan als "je".

**Horoscoop**
Twee tot drie zinnen over de maanenergie voor een Kreeft met Steenbok Ascendant.

**Human Design**
Twee zinnen over hoe zijn Manifesting Generator 1/3 vandaag het beste kan opereren.

**Numerologie**
Dagenergie ${moon.dagGetal} gekoppeld aan levensgetal 7. Twee zinnen.

**The Pattern**
Een intuïtief psychologisch patroon dat vandaag actief is, als zachte spiegel.

**Persoonlijk Weerbericht**
Drie tot vier zinnen. Grootste kans en uitdaging vandaag. Sluit af met één ankerzin.

Maximaal 350 woorden.`;

    try{
      const res=await fetch(`${WORKER_URL}/dagrapport`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({gebruiker_id:"ernesto",geboortedatum:ERNESTO.geboortedatum,jaardoelstelling:"zelfstandig wonen in een camper, 3000 euro netto per maand",prompt})});
      const data=await res.json();
      const text=data.rapport||"";
      if(!text)throw new Error();
      await saveReading(parseReading(text));
    }catch{setError("Er ging iets mis. Probeer het opnieuw.");}
    finally{setLoading(false);}
  };

  useEffect(()=>{
    if(reading?.generatedOn===todayKey)return;
    dbGet(cacheKey).then(remote=>{
      if(remote?.generatedOn===todayKey){setReadingRaw(remote);lsSet(cacheKey,remote);}
      else generateReading();
    });
  },[]);

  if(loading)return(
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:300,gap:16}}>
      <div style={{width:36,height:36,borderRadius:"50%",border:"2px solid var(--bg2)",borderTop:"2px solid var(--accent)",animation:"spin 1.2s linear infinite"}}/>
      <p style={{color:"var(--text3)",fontSize:13,fontStyle:"italic"}}>Dagenergie wordt berekend...</p>
    </div>
  );
  if(error)return(
    <div style={{textAlign:"center",padding:"40px 0"}}>
      <p style={{color:"var(--text3)",fontSize:14,marginBottom:20}}>{error}</p>
      <button onClick={generateReading} style={S.btnGhost}>Opnieuw proberen</button>
    </div>
  );
  if(!reading)return null;

  return(
    <div>
      {reading["Persoonlijk Weerbericht"]&&(
        <div style={{...S.card,borderLeft:"3px solid var(--accent)",marginBottom:24}}>
          <div style={S.label}>Persoonlijk Weerbericht</div>
          <p style={{fontSize:15,lineHeight:1.9,color:"var(--text2)",fontStyle:"italic"}}>{reading["Persoonlijk Weerbericht"]}</p>
        </div>
      )}
      {["Horoscoop","Human Design","Numerologie","The Pattern"].map(s=>reading[s]?(
        <div key={s} style={{padding:"16px 0",borderBottom:"1px solid var(--border)"}}>
          <div style={S.label}>{s}</div>
          <p style={{fontSize:14,lineHeight:1.85,color:"var(--text2)"}}>{reading[s]}</p>
        </div>
      ):null)}
      <button onClick={generateReading} style={{...S.btnGhost,marginTop:24,width:"100%"}}>Herlaad dagenergie</button>
    </div>
  );
}

// ── LIGHTBOX ──────────────────────────────────────────────────────────────
function Lightbox({photo,onClose}){
  const[caption,setCaption]=useState(()=>lsGet(`caption_${photo.id}`,""));
  const[editing,setEditing]=useState(false);
  const[draft,setDraft]=useState(caption);
  const save=()=>{dbSet(`caption_${photo.id}`,draft);setCaption(draft);setEditing(false);};
  return(
    <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.7)",zIndex:100,display:"flex",alignItems:"center",justifyContent:"center",padding:24,animation:"fadeIn 0.2s ease"}}>
      <div onClick={e=>e.stopPropagation()} style={{width:"100%",maxWidth:440}}>
        <img src={photo.src} alt="" style={{width:"100%",borderRadius:16,objectFit:"contain",maxHeight:"58vh"}}/>
        <div style={{marginTop:16}}>
          {editing?(
            <div>
              <textarea autoFocus value={draft} onChange={e=>setDraft(e.target.value)} placeholder="Voeg een tekst toe..." style={{...S.textarea,minHeight:60}}/>
              <div style={{display:"flex",gap:10,marginTop:10}}>
                <button onClick={save} style={{...S.btnPrimary,flex:1}}>Opslaan</button>
                <button onClick={()=>setEditing(false)} style={{...S.btnGhost,flex:1}}>Annuleren</button>
              </div>
            </div>
          ):(
            <div onClick={()=>{setDraft(caption);setEditing(true);}} style={{cursor:"pointer",padding:"8px 0"}}>
              <p style={{color:caption?"rgba(255,255,255,0.8)":"rgba(255,255,255,0.35)",fontSize:14,fontStyle:"italic",lineHeight:1.6}}>{caption||"Tik om een tekst toe te voegen..."}</p>
            </div>
          )}
        </div>
        <button onClick={onClose} style={{...S.btnGhost,marginTop:16,width:"100%",color:"rgba(255,255,255,0.6)",borderColor:"rgba(255,255,255,0.2)"}}>Sluiten</button>
      </div>
    </div>
  );
}

// ── PHOTO GRID ────────────────────────────────────────────────────────────
function PhotoGrid({photos,onAdd,onRemove,storagePrefix}){
  const inputRef=useRef();
  const[lightbox,setLightbox]=useState(null);
  const handleFile=e=>{
    Array.from(e.target.files).forEach(file=>{
      const reader=new FileReader();
      reader.onload=ev=>onAdd({src:ev.target.result,id:`${storagePrefix}_${Date.now()}_${Math.random().toString(36).slice(2)}`});
      reader.readAsDataURL(file);
    });e.target.value="";
  };
  return(
    <div>
      {lightbox&&<Lightbox photo={lightbox} onClose={()=>setLightbox(null)}/>}
      <div style={{display:"grid",gridTemplateColumns:"repeat(3, 1fr)",gap:8}}>
        {photos.map((photo,i)=>{
          const src=typeof photo==="string"?photo:photo.src;
          const id=typeof photo==="string"?`${storagePrefix}_${i}`:photo.id;
          return(
            <div key={i} style={{position:"relative",aspectRatio:"1",borderRadius:12,overflow:"hidden",background:"var(--bg2)"}}>
              <img src={src} alt="" onClick={()=>setLightbox({src,id})} style={{width:"100%",height:"100%",objectFit:"cover",cursor:"pointer"}}/>
              <button onClick={()=>onRemove(i)} style={{position:"absolute",top:6,right:6,background:"rgba(0,0,0,0.5)",border:"none",color:"#fff",width:24,height:24,borderRadius:"50%",cursor:"pointer",fontSize:14,lineHeight:"24px",textAlign:"center"}}>×</button>
            </div>
          );
        })}
        <button onClick={()=>inputRef.current.click()} style={{aspectRatio:"1",borderRadius:12,border:"1.5px dashed var(--border2)",background:"transparent",color:"var(--text3)",fontSize:28,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>+</button>
        <input ref={inputRef} type="file" accept="image/*" multiple style={{display:"none"}} onChange={handleFile}/>
      </div>
    </div>
  );
}

// ── DAG ───────────────────────────────────────────────────────────────────
function DagSection({todayData,onUpdate}){
  const[actie,setActie]=useState(todayData.actie||"");
  const[gedaan,setGedaan]=useState(todayData.gedaan??null);
  const save=(field,value)=>onUpdate({...todayData,[field]:value});
  return(
    <div style={{display:"flex",flexDirection:"column",gap:20}}>
      <div>
        <div style={S.label}>Kleinste actie die vandaag iets verschuift</div>
        <textarea value={actie} onChange={e=>setActie(e.target.value)} onBlur={()=>save("actie",actie)} placeholder="Schrijf hier..." style={S.textarea}/>
      </div>
      {actie&&(
        <div>
          <div style={S.label}>Heb ik het gedaan?</div>
          <div style={{display:"flex",gap:12}}>
            {[{label:"Ja",value:true},{label:"Nee",value:false}].map(opt=>(
              <button key={opt.label} onClick={()=>{setGedaan(opt.value);save("gedaan",opt.value);}}
                style={{flex:1,padding:"12px 0",borderRadius:12,border:`1.5px solid ${gedaan===opt.value?"var(--accent)":"var(--border2)"}`,background:gedaan===opt.value?"var(--accent2)":"transparent",color:gedaan===opt.value?"var(--accent)":"var(--text2)",fontSize:15,cursor:"pointer",transition:"all 0.2s",fontFamily:"'Quicksand',sans-serif",fontWeight:500}}>{opt.label}</button>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// ── DANKBAAR ──────────────────────────────────────────────────────────────
function DankbaarSection({todayData,onUpdate}){
  const[dankbaar,setDankbaar]=useState(todayData.dankbaar||"");
  const[lachen,setLachen]=useState(todayData.lachen||"");
  const save=(field,value)=>onUpdate({...todayData,[field]:value});
  return(
    <div style={{display:"flex",flexDirection:"column",gap:20}}>
      <div>
        <div style={S.label}>Waar ben ik dankbaar voor vandaag?</div>
        <textarea value={dankbaar} onChange={e=>setDankbaar(e.target.value)} onBlur={()=>save("dankbaar",dankbaar)} placeholder="Drie dingen, groot of klein..." style={S.textarea}/>
      </div>
      <div>
        <div style={S.label}>Wat heeft me vandaag doen lachen?</div>
        <textarea value={lachen} onChange={e=>setLachen(e.target.value)} onBlur={()=>save("lachen",lachen)} placeholder="Noteer het moment..." style={{...S.textarea,minHeight:64}}/>
      </div>
    </div>
  );
}

// ── PROGRESSIE ────────────────────────────────────────────────────────────
function ProgressieSection(){
  const today=getTodayKey();
  const[history,setHistory]=useState([]);
  const[selected,setSelected]=useState(null);
  const[streak,setStreak]=useState(0);
  const[totalDays,setTotalDays]=useState(0);

  useEffect(()=>{
    const keys=Object.keys(localStorage).filter(k=>k.startsWith("cs_dag_")).sort((a,b)=>b.localeCompare(a));
    const entries=keys.map(k=>({dateKey:k.replace("cs_dag_",""),data:JSON.parse(localStorage.getItem(k)||"{}")}));
    setHistory(entries);
    setTotalDays(entries.filter(e=>e.data.actie||e.data.dankbaar||e.data.lachen).length);
    let count=0,cursor=new Date();
    for(let i=0;i<365;i++){
      const key=cursor.toISOString().split("T")[0];
      const data=JSON.parse(localStorage.getItem(`cs_dag_${key}`)||"{}");
      if(data.actie||data.dankbaar||data.lachen){count++;cursor.setDate(cursor.getDate()-1);}
      else if(key===today)cursor.setDate(cursor.getDate()-1);
      else break;
    }
    setStreak(count);
  },[]);

  const isDayComplete=data=>data.gedaan===true&&data.dankbaar&&data.lachen;

  return(
    <div>
      <div style={{display:"flex",gap:12,marginBottom:28}}>
        {[{num:streak,label:"op rij"},{num:totalDays,label:"totaal"}].map((s,i)=>(
          <div key={i} style={{...S.card,flex:1,textAlign:"center",padding:"20px 16px"}}>
            <div style={{fontSize:40,fontWeight:300,color:"var(--accent)",lineHeight:1}}>{s.num}</div>
            <div style={{...S.label,marginBottom:0,marginTop:6}}>{s.label}</div>
          </div>
        ))}
      </div>
      {history.length===0?(
        <p style={{color:"var(--text3)",fontSize:14,fontStyle:"italic",textAlign:"center",marginTop:40}}>Je eerste dag begint vandaag.</p>
      ):(
        <div style={{display:"flex",flexDirection:"column",gap:2}}>
          {history.map(({dateKey,data})=>{
            if(!data.actie&&!data.dankbaar&&!data.lachen)return null;
            return(
              <div key={dateKey}>
                <button onClick={()=>setSelected(selected===dateKey?null:dateKey)}
                  style={{width:"100%",padding:"13px 14px",background:selected===dateKey?"var(--bg2)":"transparent",border:"none",borderRadius:12,display:"flex",alignItems:"center",justifyContent:"space-between",cursor:"pointer",color:"var(--text)",fontFamily:"'Quicksand',sans-serif"}}>
                  <div style={{display:"flex",alignItems:"center",gap:12}}>
                    <div style={{width:7,height:7,borderRadius:"50%",background:isDayComplete(data)?"var(--accent)":"var(--bg2)",border:"1px solid var(--border2)"}}/>
                    <span style={{fontSize:14,fontWeight:500}}>{formatDate(dateKey)}</span>
                  </div>
                  <span style={{fontSize:11,color:"var(--text3)"}}>{selected===dateKey?"▲":"▼"}</span>
                </button>
                {selected===dateKey&&(
                  <div style={{padding:"4px 14px 16px 34px",display:"flex",flexDirection:"column",gap:14}}>
                    {data.actie&&<div><div style={S.label}>Actie</div><div style={{fontSize:14,color:"var(--text2)",lineHeight:1.6}}>{data.actie}</div>{data.gedaan!==null&&<div style={{fontSize:12,color:data.gedaan?"var(--accent)":"var(--text3)",marginTop:4,fontWeight:600}}>{data.gedaan?"Gedaan":"Niet gedaan"}</div>}</div>}
                    {data.dankbaar&&<div><div style={S.label}>Dankbaarheid</div><div style={{fontSize:14,color:"var(--text2)",lineHeight:1.6}}>{data.dankbaar}</div></div>}
                    {data.lachen&&<div><div style={S.label}>Lachen</div><div style={{fontSize:14,color:"var(--text2)",lineHeight:1.6}}>{data.lachen}</div></div>}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ── APP ───────────────────────────────────────────────────────────────────
function App(){
  const[active,setActive]=useState("home");
  const[routinesBeheer,setRoutinesBeheer]=useState(false);
  const[ankerPhotos,setAnkerPhotos]=useDB("anker_photos",[]);
  const[bewijsPhotos,setBewijsPhotos]=useDB("bewijs_photos",[]);
  const[dagData,setDagData]=useDB(`dag_${getTodayKey()}`,{});
  const[mounted,setMounted]=useState(false);
  useEffect(()=>setTimeout(()=>setMounted(true),50),[]);

  const navigate=target=>{
    if(target==="routines_beheer"){setRoutinesBeheer(true);return;}
    setActive(target);setRoutinesBeheer(false);
  };

  const navItems=[
    {key:"home",label:"Thuis"},{key:"maan",label:"Maan"},{key:"energie",label:"Energie"},
    {key:"anker",label:"Wie"},{key:"bewijs",label:"Bewijs"},
    {key:"dag",label:"Dag"},{key:"dankbaar",label:"Dankb."},{key:"progressie",label:"Voort."},
  ];

  const dots=[
    {label:"Energie",done:!!lsGet(`energie_${getTodayKey()}`)},
    {label:"Wie",done:ankerPhotos.length>0},
    {label:"Actie",done:dagData.gedaan===true},
    {label:"Dankbaar",done:dagData.dankbaar?.length>2&&dagData.lachen?.length>2},
  ];

  const titles={home:null,maan:"Maan",energie:null,anker:"Wie ik al ben",bewijs:"Wat ik al heb bewogen",dag:"Vandaag",dankbaar:"Dankbaarheid & Lachen",progressie:"Progressie"};

  return(
    <div style={{minHeight:"100vh",background:"var(--bg)",fontFamily:"'Quicksand',sans-serif",color:"var(--text)",display:"flex",flexDirection:"column",maxWidth:480,margin:"0 auto",opacity:mounted?1:0,transition:"opacity 0.5s ease"}}>

      <div style={{padding:"44px 28px 22px",borderBottom:"1px solid var(--border)",background:"var(--card)"}}>
        <div style={{fontSize:11,letterSpacing:"0.18em",color:"var(--text3)",textTransform:"uppercase",marginBottom:8,fontWeight:600}}>
          {new Date().toLocaleDateString("nl-NL",{weekday:"long",day:"numeric",month:"long"})}
        </div>
        <h1 style={{fontSize:26,fontWeight:600,letterSpacing:"-0.01em",color:"var(--text)"}}>Ernesto</h1>
        <p style={{fontSize:13,color:"var(--text3)",margin:"6px 0 0",fontStyle:"italic"}}>Camper. Vrijheid. 3000 per maand.</p>
        <div style={{display:"flex",gap:14,marginTop:18}}>
          {dots.map((d,i)=>(
            <div key={i} style={{display:"flex",alignItems:"center",gap:6}}>
              <div style={{width:6,height:6,borderRadius:"50%",background:d.done?"var(--accent)":"var(--bg2)",border:"1px solid var(--border2)",transition:"background 0.4s"}}/>
              <span style={{fontSize:10,color:"var(--text3)",letterSpacing:"0.06em",fontWeight:600}}>{d.label}</span>
            </div>
          ))}
        </div>
      </div>

      <div style={{display:"flex",borderBottom:"1px solid var(--border)",overflowX:"auto",background:"var(--card)"}}>
        {navItems.map(item=>(
          <button key={item.key} onClick={()=>{setRoutinesBeheer(false);setActive(item.key);}}
            style={{flex:1,padding:"13px 4px",background:"transparent",border:"none",borderBottom:active===item.key&&!routinesBeheer?"2px solid var(--accent)":"2px solid transparent",color:active===item.key&&!routinesBeheer?"var(--accent)":"var(--text3)",fontSize:10,letterSpacing:"0.07em",textTransform:"uppercase",cursor:"pointer",transition:"all 0.2s",whiteSpace:"nowrap",fontFamily:"'Quicksand',sans-serif",fontWeight:600}}>
            {item.label}
          </button>
        ))}
      </div>

      <div style={{padding:"26px 24px",flex:1}}>
        <SetupBanner/>
        {routinesBeheer?(
          <RoutinesBeheer onBack={()=>setRoutinesBeheer(false)}/>
        ):(
          <>
            {titles[active]&&<h2 style={{fontSize:17,fontWeight:600,marginBottom:20,color:"var(--text)"}}>{titles[active]}</h2>}
            {active==="home"       &&<HomeSection onNavigate={navigate}/>}
            {active==="maan"       &&<MaanSection/>}
            {active==="energie"    &&<EnergieSection/>}
            {active==="anker"      &&<div><p style={{color:"var(--text2)",fontSize:14,marginBottom:20,lineHeight:1.7,fontStyle:"italic"}}>Foto's van wie je al bent. Tik op een foto om een tekst toe te voegen.</p><PhotoGrid photos={ankerPhotos} storagePrefix="anker" onAdd={p=>setAnkerPhotos(prev=>[...prev,p])} onRemove={i=>setAnkerPhotos(prev=>prev.filter((_,idx)=>idx!==i))}/></div>}
            {active==="bewijs"     &&<div><p style={{color:"var(--text2)",fontSize:14,marginBottom:20,lineHeight:1.7,fontStyle:"italic"}}>Foto's van wat je al hebt bewogen. Tik op een foto om een tekst toe te voegen.</p><PhotoGrid photos={bewijsPhotos} storagePrefix="bewijs" onAdd={p=>setBewijsPhotos(prev=>[...prev,p])} onRemove={i=>setBewijsPhotos(prev=>prev.filter((_,idx)=>idx!==i))}/></div>}
            {active==="dag"        &&<DagSection todayData={dagData} onUpdate={setDagData}/>}
            {active==="dankbaar"   &&<DankbaarSection todayData={dagData} onUpdate={setDagData}/>}
            {active==="progressie" &&<ProgressieSection/>}
          </>
        )}
      </div>

      <div style={{padding:"18px 24px 40px",borderTop:"1px solid var(--border)",textAlign:"center",background:"var(--card)"}}>
        <p style={{fontSize:12,color:"var(--text3)",fontStyle:"italic"}}>Elke dag dat je beweegt ben je al daar.</p>
      </div>
    </div>
  );
}

ReactDOM.render(React.createElement(App),document.getElementById("root"));
</script>
</body>
</html>
