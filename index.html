function useStorage(key, initial) {
  const [val, setVal] = useState(() => {
    try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : initial; }
    catch { return initial; }
  });
  const set = (v) => {
    const next = typeof v === "function" ? v(val) : v;
    setVal(next);
    localStorage.setItem(key, JSON.stringify(next));
  };
  return [val, set];
}

// ── MAAN BEREKENING ───────────────────────────────────────────────────────
function getMoonData() {
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth() + 1;
  const day = now.getDate();
  const JD = 367 * year - Math.floor(7 * (year + Math.floor((month + 9) / 12)) / 4) +
    Math.floor(275 * month / 9) + day + 1721013.5;
  const phase = ((JD - 2451549.5) % 29.53058867 + 29.53058867) % 29.53058867;
  let phaseNL;
  if (phase < 1.85) phaseNL = "Nieuwe Maan";
  else if (phase < 7.38) phaseNL = "Wassende Sikkel";
  else if (phase < 9.22) phaseNL = "Eerste Kwartier";
  else if (phase < 14.77) phaseNL = "Wassende Maan";
  else if (phase < 16.61) phaseNL = "Volle Maan";
  else if (phase < 22.15) phaseNL = "Afnemende Maan";
  else if (phase < 23.99) phaseNL = "Laatste Kwartier";
  else phaseNL = "Afnemende Sikkel";
  const moonLongitude = ((phase / 29.53058867) * 360 + 218.316) % 360;
  const moonSigns = ["Ram","Stier","Tweelingen","Kreeft","Leeuw","Maagd","Weegschaal","Schorpioen","Boogschutter","Steenbok","Waterman","Vissen"];
  const moonSign = moonSigns[Math.floor(moonLongitude / 30)];
  const digits = `${day}${month}${year}`.split("").map(Number);
  let sum = digits.reduce((a, b) => a + b, 0);
  while (sum > 9 && sum !== 11 && sum !== 22 && sum !== 33) {
    sum = String(sum).split("").map(Number).reduce((a, b) => a + b, 0);
  }
  return { phaseNL, moonSign, dagGetal: sum };
}

// ── PHOTO GRID ────────────────────────────────────────────────────────────
function PhotoGrid({ photos, onAdd, onRemove, storagePrefix }) {
  const inputRef = useRef();
  const [lightbox, setLightbox] = useState(null);

  const handleFile = (e) => {
    Array.from(e.target.files).forEach(file => {
      const reader = new FileReader();
      reader.onload = (ev) => onAdd({ src: ev.target.result, id: `${storagePrefix}_${Date.now()}_${Math.random().toString(36).slice(2)}` });
      reader.readAsDataURL(file);
    });
    e.target.value = "";
  };

  return (
    <div>
      {lightbox && <Lightbox photo={lightbox} onClose={() => setLightbox(null)} />}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 8 }}>
        {photos.map((photo, i) => {
          const src = typeof photo === "string" ? photo : photo.src;
          const id = typeof photo === "string" ? `${storagePrefix}_${i}` : photo.id;
          return (
            <div key={i} style={{ position: "relative", aspectRatio: "1", borderRadius: 12, overflow: "hidden", background: "#1a1a1a" }}>
              <img src={src} alt="" onClick={() => setLightbox({ src, id })} style={{ width: "100%", height: "100%", objectFit: "cover", cursor: "pointer" }} />
              <button onClick={() => onRemove(i)} style={{ position: "absolute", top: 6, right: 6, background: "rgba(0,0,0,0.6)", border: "none", color: "#fff", width: 24, height: 24, borderRadius: "50%", cursor: "pointer", fontSize: 14, lineHeight: "24px", textAlign: "center" }}>×</button>
            </div>
          );
        })}
        <button onClick={() => inputRef.current.click()} style={{ aspectRatio: "1", borderRadius: 12, border: "1.5px dashed rgba(255,255,255,0.12)", background: "transparent", color: "rgba(255,255,255,0.25)", fontSize: 28, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>+</button>
        <input ref={inputRef} type="file" accept="image/*" multiple style={{ display: "none" }} onChange={handleFile} />
      </div>
    </div>
  );
}

          <div key={i} style={{ flex: 1, background: "rgba(255,255,255,0.04)", borderRadius: 16, padding: "18px 16px", textAlign: "center" }}>
            <div style={{ fontSize: 40, fontWeight: 300, letterSpacing: "-0.02em", lineHeight: 1 }}>{s.num}</div>
            <div style={{ fontSize: 11, color: "rgba(255,255,255,0.3)", letterSpacing: "0.08em", textTransform: "uppercase", marginTop: 6 }}>{s.label}</div>
          </div>
        ))}
      </div>
      {history.length === 0 ? (
        <p style={{ color: "rgba(255,255,255,0.22)", fontSize: 14, fontStyle: "italic", textAlign: "center", marginTop: 40 }}>Je eerste dag begint vandaag.</p>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
          {history.map(({ dateKey, data }) => {
            if (!data.actie && !data.dankbaar && !data.lachen) return null;
            return (
              <div key={dateKey}>
                <button onClick={() => setSelected(selected === dateKey ? null : dateKey)}
                  style={{ width: "100%", padding: "13px 14px", background: selected === dateKey ? "rgba(255,255,255,0.05)" : "transparent", border: "none", borderRadius: 12, display: "flex", alignItems: "center", justifyContent: "space-between", cursor: "pointer", color: "#fff" }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                    <div style={{ width: 7, height: 7, borderRadius: "50%", background: isDayComplete(data) ? "rgba(255,255,255,0.65)" : "rgba(255,255,255,0.18)" }} />
                    <span style={{ fontSize: 14 }}>{formatDate(dateKey)}</span>
                  </div>
                  <span style={{ fontSize: 11, color: "rgba(255,255,255,0.2)" }}>{selected === dateKey ? "▲" : "▼"}</span>
                </button>
                {selected === dateKey && (
                  <div style={{ padding: "4px 14px 16px 34px", display: "flex", flexDirection: "column", gap: 14 }}>
                    {data.actie && <div><div style={{ fontSize: 10, color: "rgba(255,255,255,0.25)", letterSpacing: "0.1em", textTransform: "uppercase", marginBottom: 5 }}>Actie</div><div style={{ fontSize: 14, color: "rgba(255,255,255,0.65)", lineHeight: 1.6 }}>{data.actie}</div>{data.gedaan !== null && <div style={{ fontSize: 12, color: data.gedaan ? "rgba(255,255,255,0.45)" : "rgba(255,255,255,0.18)", marginTop: 4 }}>{data.gedaan ? "Gedaan" : "Niet gedaan"}</div>}</div>}
                    {data.dankbaar && <div><div style={{ fontSize: 10, color: "rgba(255,255,255,0.25)", letterSpacing: "0.1em", textTransform: "uppercase", marginBottom: 5 }}>Dankbaarheid</div><div style={{ fontSize: 14, color: "rgba(255,255,255,0.65)", lineHeight: 1.6 }}>{data.dankbaar}</div></div>}
                    {data.lachen && <div><div style={{ fontSize: 10, color: "rgba(255,255,255,0.25)", letterSpacing: "0.1em", textTransform: "uppercase", marginBottom: 5 }}>Lachen</div><div style={{ fontSize: 14, color: "rgba(255,255,255,0.65)", lineHeight: 1.6 }}>{data.lachen}</div></div>}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ── MAIN APP ──────────────────────────────────────────────────────────────
function App() {
  const [active, setActive] = useState("energie");
  const [ankerPhotos, setAnkerPhotos] = useStorage("ernesto_anker_photos", []);
  const [bewijsPhotos, setBewijsPhotos] = useStorage("ernesto_bewijs_photos", []);
  const [dagData, setDagData] = useStorage(`ernesto_dag_${getTodayKey()}`, {});
  const [mounted, setMounted] = useState(false);

  useEffect(() => setTimeout(() => setMounted(true), 50), []);

  const dots = [
    { label: "Energie", done: !!localStorage.getItem(`ernesto_energie_${getTodayKey()}`) },
    { label: "Wie", done: ankerPhotos.length > 0 },
    { label: "Actie", done: dagData.gedaan === true },
    { label: "Dankbaar", done: dagData.dankbaar?.length > 2 && dagData.lachen?.length > 2 },
  ];

  return (
    <div style={{ minHeight: "100vh", background: "#0d0d0d", fontFamily: "Georgia, serif", color: "#fff", display: "flex", flexDirection: "column", maxWidth: 480, margin: "0 auto", opacity: mounted ? 1 : 0, transition: "opacity 0.6s ease" }}>
      <div style={{ padding: "44px 28px 22px", borderBottom: "1px solid rgba(255,255,255,0.06)" }}>
        <div style={{ fontSize: 11, letterSpacing: "0.2em", color: "rgba(255,255,255,0.22)", textTransform: "uppercase", marginBottom: 8 }}>
          {new Date().toLocaleDateString("nl-NL", { weekday: "long", day: "numeric", month: "long" })}
        </div>
        <h1 style={{ fontSize: 26, fontWeight: 400, letterSpacing: "-0.01em" }}>Ernesto</h1>
        <p style={{ fontSize: 13, color: "rgba(255,255,255,0.22)", margin: "6px 0 0", fontStyle: "italic" }}>Camper. Vrijheid. 3000 per maand.</p>
        <div style={{ display: "flex", gap: 12, marginTop: 18 }}>
          {dots.map((d, i) => (
            <div key={i} style={{ display: "flex", alignItems: "center", gap: 5 }}>
              <div style={{ width: 6, height: 6, borderRadius: "50%", background: d.done ? "rgba(255,255,255,0.6)" : "rgba(255,255,255,0.1)", transition: "background 0.4s" }} />
              <span style={{ fontSize: 10, color: "rgba(255,255,255,0.18)", letterSpacing: "0.05em" }}>{d.label}</span>
            </div>
          ))}
        </div>
      </div>

      <div style={{ display: "flex", borderBottom: "1px solid rgba(255,255,255,0.06)", overflowX: "auto" }}>
        {SECTIONS.map(s => (
          <button key={s} onClick={() => setActive(s)} style={{ flex: 1, padding: "13px 4px", background: "transparent", border: "none", borderBottom: active === s ? "1.5px solid rgba(255,255,255,0.6)" : "1.5px solid transparent", color: active === s ? "#fff" : "rgba(255,255,255,0.22)", fontSize: 10, letterSpacing: "0.07em", textTransform: "uppercase", cursor: "pointer", transition: "all 0.2s", whiteSpace: "nowrap" }}>{NAV_LABELS[s]}</button>
        ))}
      </div>

      <div style={{ padding: "26px 24px", flex: 1 }}>
        {active !== "energie" && <h2 style={{ fontSize: 17, fontWeight: 400, marginBottom: 20, marginTop: 0 }}>{SECTION_LABELS[active]}</h2>}
        {active === "energie" && <EnergieSection />}
        {active === "anker" && <div><p style={{ color: "rgba(255,255,255,0.3)", fontSize: 14, marginBottom: 20, lineHeight: 1.6, fontStyle: "italic" }}>Foto's van wie je al bent. Tik op een foto om een tekst toe te voegen.</p><PhotoGrid photos={ankerPhotos} storagePrefix="anker" onAdd={p => setAnkerPhotos(prev => [...prev, p])} onRemove={i => setAnkerPhotos(prev => prev.filter((_, idx) => idx !== i))} /></div>}
        {active === "bewijs" && <div><p style={{ color: "rgba(255,255,255,0.3)", fontSize: 14, marginBottom: 20, lineHeight: 1.6, fontStyle: "italic" }}>Foto's van wat je al hebt bewogen. Tik op een foto om een tekst toe te voegen.</p><PhotoGrid photos={bewijsPhotos} storagePrefix="bewijs" onAdd={p => setBewijsPhotos(prev => [...prev, p])} onRemove={i => setBewijsPhotos(prev => prev.filter((_, idx) => idx !== i))} /></div>}
        {active === "dag" && <DagSection todayData={dagData} onUpdate={setDagData} />}
        {active === "dankbaar" && <DankbaarSection todayData={dagData} onUpdate={setDagData} />}
        {active === "progressie" && <ProgressieSection />}
      </div>

      <div style={{ padding: "18px 24px 34px", borderTop: "1px solid rgba(255,255,255,0.06)", textAlign: "center" }}>
        <p style={{ fontSize: 12, color: "rgba(255,255,255,0.1)", fontStyle: "italic" }}>Elke dag dat je beweegt ben je al daar.</p>
      </div>
    </div>
  );
}

ReactDOM.render(React.createElement(App), document.getElementById("root"));
</script>
</body>
</html>
