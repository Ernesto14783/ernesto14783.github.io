<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kennisbeheer">
<title>Cosmic Spirit — Kennisbeheer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg:#f7f4ef; --bg2:#eeeae2; --card:#ffffff;
    --border:rgba(0,0,0,0.07); --border2:rgba(0,0,0,0.13);
    --text:#2c2825; --text2:#7a7068; --text3:#b0a898;
    --accent:#c9a96e; --accent2:rgba(201,169,110,0.13);
    --astro:#7b9ea8; --hd:#8b7fa8; --num:#a8896a; --bew:#7aa88b; --over:#c9a96e;
  }
  body { background:var(--bg); color:var(--text); font-family:'Quicksand',sans-serif; font-weight:400; min-height:100vh; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  input:focus, textarea:focus, select:focus { outline:none; }
  button { font-family:'Quicksand',sans-serif; cursor:pointer; }
  ::-webkit-scrollbar { width:4px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:var(--border2); border-radius:2px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const SUPABASE_URL  = "https://glvpyebivwsjqsrbfank.supabase.co";
const SUPABASE_ANON = "sb_publishable_EHihijC7mQYD8qpl1Gq9wA_8MC4Zx9L";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

const AGENTEN = [
  {
    key:"astrologie",
    label:"Astrologie",
    kleur:"var(--astro)",
    omschrijving:"Sterrenbeelden, planeten, transits, maanfasen, maantekens",
    categorieen:["Sterrenbeeld","Planeet","Transit","Maanfase","Maanteken","Aspect","Algemeen"]
  },
  {
    key:"human_design",
    label:"Human Design",
    kleur:"var(--hd)",
    omschrijving:"Types, profielen, centra, autoriteit, transits",
    categorieen:["Type","Profiel","Centrum","Autoriteit","Transit","Poort","Kanaal","Algemeen"]
  },
  {
    key:"numerologie",
    label:"Numerologie",
    kleur:"var(--num)",
    omschrijving:"Levensgetal, meestergetallen, daggetallen, jaarcycli",
    categorieen:["Levensgetal","Meestergetal","Daggetal","Maandgetal","Persoonlijk jaar","Algemeen"]
  },
  {
    key:"bewustzijn",
    label:"Bewustzijn",
    kleur:"var(--bew)",
    omschrijving:"Filosofie, patronen, transformatie, schaduwwerk, The Pattern",
    categorieen:["Patroon","Transformatie","Schaduwwerk","The Pattern","Filosofie","Ceremonie","Algemeen"]
  },
  {
    key:"overkoepelend",
    label:"Overkoepelend",
    kleur:"var(--over)",
    omschrijving:"Verbanden tussen vakgebieden, jouw stem en stijl",
    categorieen:["Stem & stijl","Verbanden","Voorbeeldrapport","Kernfilosofie","Algemeen"]
  },
];

function App() {
  const [scherm, setScherm] = useState("overzicht");
  const [actieveAgent, setActieveAgent] = useState(null);
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(false);
  const [mounted, setMounted] = useState(false);

  useEffect(() => setTimeout(() => setMounted(true), 50), []);

  const openAgent = async (agent) => {
    setActieveAgent(agent);
    setScherm("agent");
    laadItems(agent.key);
  };

  const laadItems = async (agentKey) => {
    setLoading(true);
    try {
      const { data } = await sb.from("kennis")
        .select("*")
        .eq("agent", agentKey)
        .order("aangemaakt_op", { ascending: false });
      setItems(data || []);
    } catch {}
    setLoading(false);
  };

  const verwijderItem = async (id) => {
    await sb.from("kennis").delete().eq("id", id);
    setItems(prev => prev.filter(i => i.id !== id));
  };

  return (
    <div style={{
      minHeight:"100vh", background:"var(--bg)",
      maxWidth:600, margin:"0 auto",
      opacity:mounted?1:0, transition:"opacity 0.4s ease"
    }}>
      {scherm === "overzicht" && (
        <Overzicht agenten={AGENTEN} onOpen={openAgent} />
      )}
      {scherm === "agent" && actieveAgent && (
        <AgentScherm
          agent={actieveAgent}
          items={items}
          loading={loading}
          onTerug={() => setScherm("overzicht")}
          onToegevoegd={() => laadItems(actieveAgent.key)}
          onVerwijder={verwijderItem}
        />
      )}
    </div>
  );
}

// ── OVERZICHT ─────────────────────────────────────────────────────────────
function Overzicht({ agenten, onOpen }) {
  const [tellingen, setTellingen] = useState({});

  useEffect(() => {
    agenten.forEach(async a => {
      const { count } = await sb.from("kennis")
        .select("*", { count:"exact", head:true })
        .eq("agent", a.key);
      setTellingen(prev => ({ ...prev, [a.key]: count || 0 }));
    });
  }, []);

  return (
    <div>
      <div style={{
        padding:"44px 28px 24px",
        background:"var(--card)",
        borderBottom:"1px solid var(--border)"
      }}>
        <div style={{fontSize:11,letterSpacing:"0.18em",color:"var(--text3)",textTransform:"uppercase",marginBottom:10,fontWeight:600}}>
          Cosmic Spirit
        </div>
        <h1 style={{fontSize:26,fontWeight:600,color:"var(--text)",letterSpacing:"-0.01em"}}>Kennisbeheer</h1>
        <p style={{fontSize:13,color:"var(--text3)",marginTop:6,fontStyle:"italic"}}>
          Voed de agenten met jouw kennis en inzichten.
        </p>
      </div>

      <div style={{padding:"24px 20px", display:"flex", flexDirection:"column", gap:12}}>
        {agenten.map(agent => (
          <button key={agent.key} onClick={() => onOpen(agent)} style={{
            background:"var(--card)", border:"1px solid var(--border)",
            borderLeft:`4px solid ${agent.kleur}`,
            borderRadius:14, padding:"18px 20px",
            textAlign:"left", transition:"all 0.15s",
            display:"flex", alignItems:"center", gap:16
          }}
          onMouseEnter={e => e.currentTarget.style.borderColor = agent.kleur}
          onMouseLeave={e => e.currentTarget.style.borderColor = "var(--border)"}
          >
            <div style={{flex:1}}>
              <div style={{fontSize:16,fontWeight:600,color:"var(--text)",marginBottom:4}}>{agent.label}</div>
              <div style={{fontSize:12,color:"var(--text3)",lineHeight:1.5}}>{agent.omschrijving}</div>
            </div>
            <div style={{textAlign:"center",flexShrink:0}}>
              <div style={{fontSize:24,fontWeight:300,color:agent.kleur,lineHeight:1}}>{tellingen[agent.key] ?? "—"}</div>
              <div style={{fontSize:10,color:"var(--text3)",marginTop:2,letterSpacing:"0.06em",textTransform:"uppercase"}}>items</div>
            </div>
          </button>
        ))}
      </div>
    </div>
  );
}

// ── AGENT SCHERM ──────────────────────────────────────────────────────────
function AgentScherm({ agent, items, loading, onTerug, onToegevoegd, onVerwijder }) {
  const [tab, setTab] = useState("toevoegen");

  return (
    <div>
      <div style={{
        padding:"44px 28px 0",
        background:"var(--card)",
        borderBottom:"1px solid var(--border)"
      }}>
        <button onClick={onTerug} style={{
          background:"none", border:"none", color:"var(--text3)",
          fontSize:13, fontWeight:500, padding:"0 0 16px", display:"flex",
          alignItems:"center", gap:6
        }}>← Terug</button>

        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:16}}>
          <div style={{width:10,height:10,borderRadius:"50%",background:agent.kleur,flexShrink:0}}/>
          <h1 style={{fontSize:22,fontWeight:600,color:"var(--text)"}}>{agent.label}</h1>
        </div>
        <p style={{fontSize:13,color:"var(--text3)",marginBottom:20,lineHeight:1.6}}>{agent.omschrijving}</p>

        <div style={{display:"flex",gap:0}}>
          {["toevoegen","kennisbank"].map(t => (
            <button key={t} onClick={() => setTab(t)} style={{
              flex:1, padding:"11px 8px", background:"transparent", border:"none",
              borderBottom: tab===t ? `2px solid ${agent.kleur}` : "2px solid transparent",
              color: tab===t ? agent.kleur : "var(--text3)",
              fontSize:12, fontWeight:600, letterSpacing:"0.06em",
              textTransform:"uppercase", transition:"all 0.2s"
            }}>
              {t === "toevoegen" ? "Toevoegen" : `Kennisbank (${items.length})`}
            </button>
          ))}
        </div>
      </div>

      <div style={{padding:"24px 20px"}}>
        {tab === "toevoegen" && (
          <ToevoegenForm agent={agent} onToegevoegd={() => { onToegevoegd(); setTab("kennisbank"); }} />
        )}
        {tab === "kennisbank" && (
          <KennisbankLijst items={items} loading={loading} agent={agent} onVerwijder={onVerwijder} />
        )}
      </div>
    </div>
  );
}

// ── TOEVOEGEN FORM ────────────────────────────────────────────────────────
function ToevoegenForm({ agent, onToegevoegd }) {
  const [categorie, setCategorie] = useState(agent.categorieen[0]);
  const [inhoud, setInhoud] = useState("");
  const [saving, setSaving] = useState(false);
  const [success, setSuccess] = useState(false);

  const opslaan = async () => {
    if (!inhoud.trim()) return;
    setSaving(true);
    try {
      await sb.from("kennis").insert({
        agent: agent.key,
        categorie,
        inhoud: inhoud.trim(),
      });
      setInhoud("");
      setSuccess(true);
      setTimeout(() => setSuccess(false), 2500);
      onToegevoegd();
    } catch {}
    setSaving(false);
  };

  return (
    <div style={{display:"flex",flexDirection:"column",gap:18}}>
      <div>
        <div style={{fontSize:11,color:"var(--text3)",letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:8,fontWeight:600}}>Categorie</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
          {agent.categorieen.map(c => (
            <button key={c} onClick={() => setCategorie(c)} style={{
              padding:"7px 14px", borderRadius:20,
              border:`1.5px solid ${categorie===c ? agent.kleur : "var(--border2)"}`,
              background: categorie===c ? `${agent.kleur}20` : "transparent",
              color: categorie===c ? agent.kleur : "var(--text2)",
              fontSize:12, fontWeight:600, transition:"all 0.15s"
            }}>{c}</button>
          ))}
        </div>
      </div>

      <div>
        <div style={{fontSize:11,color:"var(--text3)",letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:8,fontWeight:600}}>
          Kennis / inzicht
        </div>
        <textarea
          value={inhoud}
          onChange={e => setInhoud(e.target.value)}
          placeholder={`Schrijf hier jouw kennis over ${agent.label.toLowerCase()}...\n\nDit kan zijn:\n— Een interpretatie\n— Een patroon dat je ziet\n— Een samenvatting van een bron\n— Een inzicht uit je praktijk`}
          style={{
            width:"100%", minHeight:200, background:"var(--card)",
            border:"1px solid var(--border2)", borderRadius:14,
            color:"var(--text)", padding:"16px", fontSize:14,
            fontFamily:"'Quicksand',sans-serif", fontWeight:400,
            resize:"vertical", outline:"none", lineHeight:1.75
          }}
        />
        <div style={{fontSize:11,color:"var(--text3)",marginTop:6,textAlign:"right"}}>
          {inhoud.length} tekens
        </div>
      </div>

      {success && (
        <div style={{
          background:"rgba(122,168,139,0.15)", border:"1px solid rgba(122,168,139,0.4)",
          borderRadius:10, padding:"12px 16px", fontSize:13, color:"var(--bew)",
          fontWeight:500, animation:"fadeIn 0.2s ease"
        }}>
          Opgeslagen in de kennisbank.
        </div>
      )}

      <button
        onClick={opslaan}
        disabled={saving || !inhoud.trim()}
        style={{
          padding:"14px", borderRadius:12, border:"none",
          background: saving||!inhoud.trim() ? "var(--bg2)" : agent.kleur,
          color: saving||!inhoud.trim() ? "var(--text3)" : "#fff",
          fontSize:14, fontWeight:600,
          transition:"all 0.2s"
        }}
      >
        {saving ? "Opslaan..." : "Toevoegen aan kennisbank"}
      </button>
    </div>
  );
}

// ── KENNISBANK LIJST ──────────────────────────────────────────────────────
function KennisbankLijst({ items, loading, agent, onVerwijder }) {
  const [uitgevouwen, setUitgevouwen] = useState(null);
  const [bevestig, setBevestig] = useState(null);

  if (loading) return (
    <div style={{display:"flex",justifyContent:"center",padding:"40px 0"}}>
      <div style={{width:28,height:28,borderRadius:"50%",border:"2px solid var(--bg2)",borderTop:`2px solid ${agent.kleur}`,animation:"spin 1.2s linear infinite"}}/>
    </div>
  );

  if (items.length === 0) return (
    <div style={{textAlign:"center",padding:"48px 0"}}>
      <div style={{fontSize:32,marginBottom:12}}>📭</div>
      <p style={{fontSize:14,color:"var(--text3)",fontStyle:"italic"}}>Nog geen kennis toegevoegd voor deze agent.</p>
    </div>
  );

  const groepeerdPerCategorie = items.reduce((acc, item) => {
    const cat = item.categorie || "Overig";
    if (!acc[cat]) acc[cat] = [];
    acc[cat].push(item);
    return acc;
  }, {});

  return (
    <div style={{display:"flex",flexDirection:"column",gap:24}}>
      {Object.entries(groepeerdPerCategorie).map(([cat, catItems]) => (
        <div key={cat}>
          <div style={{
            fontSize:11, color:agent.kleur, letterSpacing:"0.1em",
            textTransform:"uppercase", marginBottom:10, fontWeight:600,
            display:"flex", alignItems:"center", gap:8
          }}>
            <div style={{width:6,height:6,borderRadius:"50%",background:agent.kleur}}/>
            {cat} ({catItems.length})
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {catItems.map(item => (
              <div key={item.id} style={{
                background:"var(--card)", border:"1px solid var(--border)",
                borderRadius:12, overflow:"hidden",
                animation:"fadeIn 0.2s ease"
              }}>
                <button
                  onClick={() => setUitgevouwen(uitgevouwen === item.id ? null : item.id)}
                  style={{
                    width:"100%", padding:"14px 16px", background:"transparent",
                    border:"none", textAlign:"left", display:"flex",
                    alignItems:"flex-start", gap:12
                  }}
                >
                  <div style={{flex:1}}>
                    <div style={{
                      fontSize:13, color:"var(--text)", lineHeight:1.5, fontWeight:400,
                      display:"-webkit-box", WebkitLineClamp: uitgevouwen===item.id ? "unset" : 2,
                      WebkitBoxOrient:"vertical", overflow: uitgevouwen===item.id ? "visible" : "hidden"
                    }}>
                      {item.inhoud}
                    </div>
                    <div style={{fontSize:11,color:"var(--text3)",marginTop:6}}>
                      {new Date(item.aangemaakt_op).toLocaleDateString("nl-NL",{day:"numeric",month:"long",year:"numeric"})}
                    </div>
                  </div>
                  <span style={{fontSize:11,color:"var(--text3)",flexShrink:0,marginTop:2}}>
                    {uitgevouwen===item.id ? "▲" : "▼"}
                  </span>
                </button>

                {uitgevouwen === item.id && (
                  <div style={{padding:"0 16px 14px",borderTop:"1px solid var(--border)"}}>
                    {bevestig === item.id ? (
                      <div style={{display:"flex",gap:8,paddingTop:12}}>
                        <button onClick={() => { onVerwijder(item.id); setBevestig(null); setUitgevouwen(null); }} style={{
                          flex:1, padding:"9px", borderRadius:8, border:"none",
                          background:"#c0392b", color:"#fff", fontSize:12, fontWeight:600
                        }}>Ja, verwijder</button>
                        <button onClick={() => setBevestig(null)} style={{
                          flex:1, padding:"9px", borderRadius:8,
                          border:"1px solid var(--border2)", background:"transparent",
                          color:"var(--text2)", fontSize:12, fontWeight:500
                        }}>Annuleren</button>
                      </div>
                    ) : (
                      <button onClick={() => setBevestig(item.id)} style={{
                        marginTop:12, background:"none", border:"none",
                        color:"var(--text3)", fontSize:12, fontWeight:500,
                        padding:0
                      }}>Verwijderen</button>
                    )}
                  </div>
                )}
              </div>
            ))}
          </div>
        </div>
      ))}
    </div>
  );
}

ReactDOM.render(React.createElement(App), document.getElementById("root"));
</script>
</body>
</html>
